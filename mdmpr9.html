<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal To-Do List</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body
    class="min-h-screen  bg-gradient-to-r from-slate-900 via-purple-300 to-slate-900 flex items-center justify-center">

    <div class="bg-white w-full max-w-md p-6 rounded-xl shadow-lg">

        <h1 class="text-3xl font-bold text-center text-stone-600 mb-2">
            CD25121 To-Do List
        </h1>

        <p class="text-center text-stone-500 mb-6">
            Daily task
        </p>

        <!-- Task Input -->
        <div class="flex gap-2 mb-5">

            <input type="text" id="taskInput" placeholder="Enter your task"
                class="flex-1 border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">

            <button onclick="addTask()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">
                Add Task
            </button>

        </div>

        <!-- Task List -->
        <ul id="taskList" class="space-y-3"></ul>

        <p id="emptyMessage" class="text-center text-gray-400 mt-4">
            No tasks added yet.
        </p>

    </div>

    <script>

        function addTask() {

            let input = document.getElementById("taskInput");
            let taskText = input.value.trim();

            if (taskText === "") {
                alert("Please enter a task!");
                return;
            }

            let li = document.createElement("li");

            li.className = "flex items-center justify-between bg-gray-50 p-3 rounded-lg border";

            // Task Text
            let span = document.createElement("span");
            span.textContent = taskText;
            span.className = "flex-1 cursor-pointer";

            // Mark Task as Completed
            span.onclick = function () {
                span.classList.toggle("line-through");
                span.classList.toggle("text-gray-400");
            };

            // Delete Button
            let deleteBtn = document.createElement("button");
            deleteBtn.textContent = "Delete";
            deleteBtn.className = "bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600 ml-3";

            deleteBtn.onclick = function () {
                li.remove();
                updateMessage();
            };

            li.appendChild(span);
            li.appendChild(deleteBtn);

            document.getElementById("taskList").appendChild(li);

            input.value = "";

            updateMessage();
        }

        // Update Empty Message
        function updateMessage() {

            let taskList = document.getElementById("taskList");
            let emptyMessage = document.getElementById("emptyMessage");

            if (taskList.children.length === 0) {
                emptyMessage.style.display = "block";
            } else {
                emptyMessage.style.display = "none";
            }
        }

        // Add Task Using Enter Key
        document.getElementById("taskInput").addEventListener("keypress", function (event) {

            if (event.key === "Enter") {
                addTask();
            }

        });

    </script>

</body>

</html>
